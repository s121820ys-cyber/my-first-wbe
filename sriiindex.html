<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>生日快乐</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;}

body{
  display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(ellipse 80% 50% at 50% 12%, #3b1257, transparent 70%),
    radial-gradient(ellipse 70% 45% at 12% 88%, #132a5e, transparent 70%),
    radial-gradient(ellipse 70% 45% at 88% 88%, #5a0f3f, transparent 70%),
    #06030c;
}

#sky{position:fixed;inset:0;z-index:1;pointer-events:none;}

/* ===== 内容区 ===== */
.content{
  position:relative;z-index:2;
  width:100%;text-align:center;
  padding:0 4vw;
  display:flex;flex-direction:column;align-items:center;gap:clamp(16px,3vh,44px);
}

.kicker{
  font-size:clamp(11px,2.4vmin,18px);
  font-weight:600;letter-spacing:.75em;text-indent:.75em;
  color:#ffd76e;
  text-shadow:0 0 10px #ffd76e,0 0 28px rgba(255,157,61,.8);
  animation:rise 1s .1s both;
}

.title{
  font-size:clamp(52px,15vmin,150px);
  font-weight:800;letter-spacing:.06em;
  color:#fff;
  animation:rise 1.2s .25s both, glow 3.6s ease-in-out 1.5s infinite;
}
@keyframes glow{
  0%,100%{text-shadow:0 0 4px #fff,0 0 14px #ff3d9a,0 0 34px #ff3d9a,0 0 70px #b03bff,0 0 120px #a855f7;}
  50%    {text-shadow:0 0 2px #fff,0 0 8px #ff3d9a,0 0 22px #ff3d9a,0 0 46px #b03bff,0 0 80px #a855f7;}
}
@keyframes rise{from{opacity:0;transform:translateY(28px);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}

/* ===== 流动滚动条 ===== */
.marquee{
  position:relative;width:100%;overflow:hidden;
  padding:clamp(10px,1.6vh,18px) 0;
  border-top:1px solid rgba(255,255,255,.12);
  border-bottom:1px solid rgba(255,255,255,.12);
  box-shadow:inset 0 0 40px rgba(168,85,247,.14);
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);
  animation:rise 1.1s .5s both;
}
.track{
  display:flex;width:max-content;white-space:nowrap;
  animation:scroll 16s linear infinite;
  will-change:transform;
}
.track.rev{animation-direction:reverse;}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}

.track span{
  padding:0 clamp(18px,3vw,40px);
  font-size:clamp(16px,4.4vmin,30px);
  font-weight:500;letter-spacing:.05em;
  color:#ffeaf6;
  text-shadow:0 0 10px #ff3d9a,0 0 26px #a855f7;
}
.track span::after{
  content:'✦';margin-left:clamp(18px,3vw,40px);
  font-size:.6em;color:#ffd76e;
  text-shadow:0 0 10px #ffd76e,0 0 26px rgba(255,157,61,.9);
  vertical-align:middle;
}

.sub{
  font-size:clamp(11px,2.2vmin,17px);
  letter-spacing:.4em;text-indent:.4em;
  color:rgba(255,235,246,.8);
  text-shadow:0 0 14px rgba(255,61,154,.8),0 0 34px rgba(168,85,247,.6);
  animation:rise 1.1s .7s both;
}

/* ===== 播放按钮 ===== */
#play{
  position:fixed;left:50%;bottom:8%;transform:translateX(-50%);
  z-index:9;padding:14px 36px;border:0;border-radius:999px;
  font-family:inherit;font-size:16px;font-weight:700;color:#fff;cursor:pointer;
  background:linear-gradient(135deg,#ff3d9a,#a855f7);
  box-shadow:0 0 26px rgba(255,61,154,.75),0 0 70px rgba(168,85,247,.55);
  animation:btn 2s ease-in-out infinite;
}
@keyframes btn{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.07)}}
</style>
</head>
<body>

<canvas id="sky"></canvas>

<div class="content">
  <p class="kicker">HAPPY BIRTHDAY</p>
  <h1 class="title">生日快乐</h1>
  <div class="marquee"><div class="track" id="t1"></div></div>
  <div class="marquee"><div class="track rev" id="t2"></div></div>
  <p class="sub">愿 你 岁 岁 平 安 · 年 年 欢 喜</p>
</div>

<button id="play">▶ 点我播放</button>

<script>
/* ========== 祝福语，随便改 ========== */
const W1 = ['愿你岁岁平安，年年欢喜','愿你眼里有光，心中有爱','愿所有美好都如期而至'];
const W2 = ['生日快乐，万事胜意','愿你被这世界温柔以待','星光不负赶路人，岁月温柔待你'];

function fill(id, arr){
  const html = arr.map(t => `<span>${t}</span>`).join('');
  document.getElementById(id).innerHTML = html.repeat(4);
}
fill('t1', W1);
fill('t2', W2);

/* ========== 星空 ========== */
(function(){
  const c = document.getElementById('sky'), x = c.getContext('2d');
  let W, H, S = [];

  function init(){
    W = c.width = innerWidth;
    H = c.height = innerHeight;
    S = Array.from({length:130}, () => ({
      x: Math.random()*W, y: Math.random()*H,
      r: Math.random()*1.5 + .4,
      p: Math.random()*6.28,
      s: .015 + Math.random()*.03
    }));
  }
  init();
  addEventListener('resize', init);

  (function loop(){
    x.clearRect(0,0,W,H);
    for(const s of S){
      s.p += s.s;
      x.globalAlpha = .3 + .7*(.5 + .5*Math.sin(s.p));
      x.fillStyle = '#fff';
      x.shadowBlur = 8;
      x.shadowColor = '#ff8ad4';
      x.beginPath();
      x.arc(s.x, s.y, s.r, 0, 6.29);
      x.fill();
    }
    requestAnimationFrame(loop);
  })();
})();

/* ========== 全屏播放 ========== */
document.getElementById('play').addEventListener('click', function(){
  if(document.documentElement.requestFullscreen){
    document.documentElement.requestFullscreen().catch(()=>{});
  }
  this.style.display = 'none';
});
</script>
</body>
</html>
