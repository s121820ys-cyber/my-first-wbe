<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>致我最爱的老婆 · 生日快乐</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  body {
    min-height: 100vh;
    color: #fff;
    overflow-x: hidden;
    background: #3a0b2e;
    position: relative;
  }

  .bg {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(circle at 18% 18%, #ff9a9e 0%, transparent 48%),
      radial-gradient(circle at 82% 12%, #ffc2e2 0%, transparent 46%),
      radial-gradient(circle at 50% 88%, #a18cd1 0%, transparent 56%),
      linear-gradient(160deg, #ff9a9e 0%, #fad0c4 26%, #fbc2eb 58%, #a18cd1 100%);
    animation: bgFloat 18s ease-in-out infinite alternate;
  }
  @keyframes bgFloat {
    from { transform: scale(1) rotate(0deg); }
    to   { transform: scale(1.12) rotate(2deg); }
  }

  .bubble {
    position: fixed; border-radius: 50%; filter: blur(52px);
    opacity: .5; z-index: 1; pointer-events: none;
    animation: bubbleFloat 15s ease-in-out infinite alternate;
  }
  .bubble.b1 { width: 260px; height: 260px; left: -70px; top: 6%;  background: #ff6fa5; }
  .bubble.b2 { width: 230px; height: 230px; right: -60px; top: 32%; background: #b388ff; animation-delay: -5s; }
  .bubble.b3 { width: 320px; height: 320px; left: 16%; bottom: -90px; background: #ffd1e8; animation-delay: -9s; }
  @keyframes bubbleFloat {
    from { transform: translateY(0) scale(1); }
    to   { transform: translateY(-46px) scale(1.16); }
  }

  .layer { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  #stars { z-index: 2; }
  #hearts { z-index: 3; }

  .star {
    position: absolute; border-radius: 50%; background: #fff;
    box-shadow: 0 0 6px 2px rgba(255,255,255,.85), 0 0 14px 5px rgba(255,170,215,.6);
    animation: twinkle 2.4s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: .12; transform: scale(.6); }
    50%      { opacity: 1;   transform: scale(1.3); }
  }

  .heart {
    position: absolute; bottom: -80px;
    animation: floatUp linear infinite;
    filter: drop-shadow(0 0 10px rgba(255,110,175,.85));
    will-change: transform;
  }
  @keyframes floatUp {
    0%   { transform: translateY(0) translateX(0) rotate(0deg) scale(.7); opacity: 0; }
    12%  { opacity: 1; }
    50%  { transform: translateY(-58vh) translateX(26px) rotate(180deg) scale(1); }
    88%  { opacity: .85; }
    100% { transform: translateY(-120vh) translateX(-16px) rotate(360deg) scale(1.15); opacity: 0; }
  }

  .card {
    position: relative; z-index: 10;
    max-width: 720px; margin: 0 auto;
    padding: 26px 16px 56px;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  .glass {
    width: 100%;
    border-radius: 32px;
    padding: 20px 16px 34px;
    background: rgba(255,255,255,.15);
    backdrop-filter: blur(18px) saturate(1.3);
    -webkit-backdrop-filter: blur(18px) saturate(1.3);
    border: 1px solid rgba(255,255,255,.4);
    box-shadow: 0 26px 70px rgba(110,20,70,.35), inset 0 1px 0 rgba(255,255,255,.6);
    overflow: hidden;
  }

  .marquee {
    position: relative; overflow: hidden; white-space: nowrap;
    padding: 6px 0; margin: 2px 0;
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 7%, #000 93%, transparent 100%);
    mask-image: linear-gradient(90deg, transparent 0, #000 7%, #000 93%, transparent 100%);
  }
  .marquee-track {
    display: inline-block; white-space: nowrap;
    animation: marqueeMove 26s linear infinite;
    will-change: transform;
  }
  .marquee-track span {
    display: inline-block; padding: 0 16px;
    font-size: 15px; letter-spacing: 1px;
    color: #fff7fc;
    text-shadow: 0 2px 12px rgba(190,40,110,.6);
  }
  @keyframes marqueeMove {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }
  .marquee.slow .marquee-track { animation-duration: 38s; }
  .marquee.slow .marquee-track span { font-size: 13px; opacity: .92; }
  .marquee.top { margin-bottom: 4px; }
  .marquee.top .marquee-track span { font-size: 14px; letter-spacing: 2px; }

  h1 {
    font-size: clamp(26px, 7.4vw, 44px);
    margin: 8px 0 4px;
    letter-spacing: 3px;
    text-align: center;
    background: linear-gradient(180deg, #ffffff 0%, #ffe6f3 55%, #ffb9dc 100%);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    filter: drop-shadow(0 4px 14px rgba(214,51,108,.5));
  }
  .date {
    text-align: center;
    font-size: clamp(13px, 3.6vw, 16px);
    letter-spacing: 1.5px;
    opacity: .95;
    margin-bottom: 14px;
    text-shadow: 0 2px 10px rgba(180,40,110,.5);
  }

  .slideshow {
    position: relative;
    width: 100%;
    height: clamp(230px, 42vh, 360px);
    margin: 12px 0 12px;
    border-radius: 24px;
    overflow: hidden;
    background: linear-gradient(135deg, #ffb3d1, #e0b3ff, #b7a6ff);
    border: 3px solid rgba(255,255,255,.8);
    box-shadow: 0 16px 40px rgba(120,20,70,.38), 0 0 0 7px rgba(255,255,255,.14);
  }
  .slideshow::before {
    content: '💖';
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 66px; opacity: .9; z-index: 0;
    animation: beat 2.4s ease-in-out infinite;
  }
  @keyframes beat {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.18); }
  }
  .slide {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    opacity: 0;
    transform: scale(1.06);
    transition: opacity 1.4s ease-in-out;
    z-index: 1;
  }
  .slide.active {
    opacity: 1;
    animation: kenburns 7.5s ease-out forwards;
  }
  @keyframes kenburns {
    from { transform: scale(1.06); }
    to   { transform: scale(1.18); }
  }
  .slideshow .shade {
    position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background: linear-gradient(to top, rgba(130,20,80,.45), rgba(255,255,255,0) 48%);
  }
  .slideshow .deco {
    position: absolute; z-index: 3; pointer-events: none;
    font-size: 18px; opacity: .9;
    filter: drop-shadow(0 0 8px rgba(255,120,180,.9));
    animation: decoFloat 3.6s ease-in-out infinite;
  }
  .slideshow .deco.d1 { left: 14px; top: 14px; }
  .slideshow .deco.d2 { right: 16px; top: 22px; animation-delay: -1.2s; }
  .slideshow .deco.d3 { right: 46px; bottom: 16px; animation-delay: -2.4s; }
  @keyframes decoFloat {
    0%, 100% { transform: translateY(0) scale(1); }
    50%      { transform: translateY(-8px) scale(1.15); }
  }

  .btn {
    display: block; margin: 16px auto 0;
    border: none; border-radius: 999px;
    padding: 15px 34px;
    font-size: clamp(16px, 4.4vw, 18px);
    font-weight: 700; letter-spacing: 1px;
    color: #d6336c;
    background: linear-gradient(135deg, #ffffff, #ffe3ee);
    box-shadow: 0 12px 30px rgba(214,51,108,.45), inset 0 1px 0 #fff;
    cursor: pointer;
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.06); }
  }
  .music-tip {
    text-align: center;
    margin-top: 14px;
    font-size: 13px;
    line-height: 1.7;
    opacity: .9;
    text-shadow: 0 2px 10px rgba(180,40,110,.5);
  }

  .message { margin-top: 4px; }
  .message p {
    font-size: clamp(15px, 4.2vw, 19px);
    line-height: 1.95;
    margin: 10px 0;
    opacity: 0;
    transform: translateY(18px);
    text-shadow: 0 2px 12px rgba(160,30,100,.45);
  }
  .message.show p { animation: fadeUp .9s forwards; }
  .message.show p:nth-child(1)  { animation-delay: .10s; }
  .message.show p:nth-child(2)  { animation-delay: .35s; }
  .message.show p:nth-child(3)  { animation-delay: .60s; }
  .message.show p:nth-child(4)  { animation-delay: .85s; }
  .message.show p:nth-child(5)  { animation-delay: 1.10s; }
  .message.show p:nth-child(6)  { animation-delay: 1.35s; }
  .message.show p:nth-child(7)  { animation-delay: 1.60s; }
  .message.show p:nth-child(8)  { animation-delay: 1.85s; }
  .message.show p:nth-child(9)  { animation-delay: 2.10s; }
  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }
  .signature {
    text-align: right;
    font-size: 17px !important;
    font-weight: 700;
    margin-top: 20px !important;
  }

  .boom {
    position: fixed;
    pointer-events: none;
    z-index: 99;
    transform: translate(-50%, -50%);
    animation: boom 1.3s cubic-bezier(.2,.7,.3,1) forwards;
    filter: drop-shadow(0 0 8px rgba(255,110,175,.9));
  }
  @keyframes boom {
    from { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    to {
      transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) rotate(var(--r)) scale(.35);
      opacity: 0;
    }
  }
</style>
</head>
<body>

<div class="bg"></div>
<span class="bubble b1"></span>
<span class="bubble b2"></span>
<span class="bubble b3"></span>
<div class="layer" id="stars"></div>
<div class="layer" id="hearts"></div>

<div class="card">
  <div class="glass">

    <div class="marquee top">
      <div class="marquee-track"></div>
    </div>

    <h1>致我最爱的老婆</h1>
    <div class="date">生日快乐 · 今天为你而浪漫</div>

    <div class="slideshow" id="slideContainer">
      <img src="1.jpg"  class="slide active" alt="memory" onerror="this.style.display='none'">
      <img src="2.jpg"  class="slide" alt="memory" onerror="this.style.display='none'">
      <img src="3.jpg"  class="slide" alt="memory" onerror="this.style.display='none'">
      <img src="4.jpg"  class="slide" alt="memory" onerror="this.style.display='none'">
      <img src="5.jpg"  class="slide" alt="memory" onerror="this.style.display='none'">
      <img src="6.jpg"  class="slide" alt="memory" onerror="this.style.display='none'">
      <img src="7.jpg"  class="slide" alt="memory" onerror="this.style.display='none'">
      <img src="8.jpg"  class="slide" alt="memory" onerror="this.style.display='none'">
      <img src="9.jpg"  class="slide" alt="memory" onerror="this.style.display='none'">
      <img src="10.jpg" class="slide" alt="memory" onerror="this.style.display='none'">
      <img src="11.jpg" class="slide" alt="memory" onerror="this.style.display='none'">
      <img src="12.jpg" class="slide" alt="memory" onerror="this.style.display='none'">
      <img src="13.jpg" class="slide" alt="memory" onerror="this.style.display='none'">
      <img src="14.jpg" class="slide" alt="memory" onerror="this.style.display='none'">
      <img src="15.jpg" class="slide" alt="memory" onerror="this.style.display='none'">
      <img src="16.jpg" class="slide" alt="memory" onerror="this.style.display='none'">
      <img src="17.jpg" class="slide" alt="memory" onerror="this.style.display='none'">
      <div class="shade"></div>
      <span class="deco d1">💗</span>
      <span class="deco d2">✨</span>
      <span class="deco d3">🌸</span>
    </div>

    <div class="marquee slow">
      <div class="marquee-track"></div>
    </div>

    <button class="btn" id="startBtn">💗 轻触这里，开启生日惊喜</button>
    <div class="music-tip" id="musicTip">点击后，浪漫的祝福会为你出现</div>

    <div class="message" id="loveContent">
      <p>亲爱的老婆：</p>
      <p>从遇见你的那天起，我的世界就有了温柔的方向。</p>
      <p>你笑的时候，像春日花海开满整个夏天；</p>
      <p>你皱眉的时候，我想把全世界的糖都给你。</p>
      <p>谢谢你陪我走过平凡的日子，把柴米油盐过成浪漫的诗。</p>
      <p>今天是你生日，我想认真地对你说：</p>
      <p>不止今天，而是余生每一天，我都爱你。</p>
      <p>愿你所愿皆成，愿你眼里有光，心中有暖，身边有我。</p>
      <p class="signature">——永远爱你的老公</p>
    </div>

  </div>
</div>

<script>
/* ================= 星空 ================= */
(function makeStars () {
  const box = document.getElementById('stars');
  const n = window.innerWidth < 600 ? 46 : 82;
  let html = '';
  for (let i = 0; i < n; i++) {
    const size = (1.5 + Math.random() * 2.6).toFixed(1);
    html += '<i class="star" style="'
      + 'left:' + (Math.random() * 100).toFixed(2) + 'vw;'
      + 'top:' + (Math.random() * 100).toFixed(2) + 'vh;'
      + 'width:' + size + 'px;height:' + size + 'px;'
      + 'animation-delay:' + (Math.random() * 3).toFixed(2) + 's;'
      + 'animation-duration:' + (1.6 + Math.random() * 2.6).toFixed(2) + 's;'
      + '"></i>';
  }
  box.innerHTML = html;
})();

/* ================= 爱心雨 ================= */
(function makeHearts () {
  const box = document.getElementById('hearts');
  const chars = ['❤', '💗', '💕', '💖', '💘', '💞', '🌸', '✨'];
  const n = window.innerWidth < 600 ? 22 : 34;
  let html = '';
  for (let i = 0; i < n; i++) {
    html += '<span class="heart" style="'
      + 'left:' + (Math.random() * 100).toFixed(2) + 'vw;'
      + 'font-size:' + (13 + Math.random() * 26).toFixed(0) + 'px;'
      + 'animation-duration:' + (9 + Math.random() * 11).toFixed(1) + 's;'
      + 'animation-delay:' + (-Math.random() * 18).toFixed(1) + 's;'
      + '">' + chars[Math.floor(Math.random() * chars.length)] + '</span>';
  }
  box.innerHTML = html;
})();

/* ================= 滚动字幕 ================= */
function fillMarquee (el, items) {
  const track = el.querySelector('.marquee-track');
  const one = items.map(t => '<span>' + t + '</span>').join('');
  track.innerHTML = one + one;
}

fillMarquee(document.querySelector('.marquee.top'), [
  '❤ 生日快乐，我最爱的老婆',
  '💖 愿你眼里有光 心中有暖',
  '🌸 余生每一天都想和你在一起',
  '✨ 今天你是全世界最幸福的人'
]);

fillMarquee(document.querySelector('.marquee.slow'), [
  '💗 你一笑，我的世界就开满了花',
  '💕 柴米油盐，也想和你过成诗',
  '💖 从心动到古稀，都是你',
  '🌸 想牵着你的手，把日子慢慢走完'
]);

/* ================= 幻灯片自动播放 ================= */
const slides = Array.from(document.querySelectorAll('.slide'));
let current = 0;

function usable (i) {
  const img = slides[i];
  return !!img && img.dataset.ok !== '0' && img.style.display !== 'none';
}

function goTo (i) {
  slides.forEach(s => s.classList.remove('active'));
  if (usable(i)) slides[i].classList.add('active');
  current = i;
}

function nextSlide () {
  if (!slides.length) return;
  let target = -1;
  for (let k = 1; k <= slides.length; k++) {
    const j = (current + k) % slides.length;
    if (usable(j)) { target = j; break; }
  }
  if (target === -1) return;
  goTo(target);
}

slides.forEach((img, i) => {
  img.addEventListener('load', () => { img.dataset.ok = '1'; });
  img.addEventListener('error', () => {
    img.dataset.ok = '0';
    img.style.display = 'none';
    img.classList.remove('active');
    if (i === current) nextSlide();
  });
});

setInterval(nextSlide, 4000);

/* ================= 点击爆出爱心 ================= */
function burst (x, y, count) {
  const chars = ['❤', '💗', '💖', '💕', '✨', '🌸'];
  for (let i = 0; i < count; i++) {
    const s = document.createElement('div');
    s.className = 'boom';
    s.textContent = chars[Math.floor(Math.random() * chars.length)];
    s.style.left = x + 'px';
    s.style.top = y + 'px';
    s.style.fontSize = (16 + Math.random() * 20).toFixed(0) + 'px';
    const ang = Math.random() * Math.PI * 2;
    const dist = 60 + Math.random() * 150;
    s.style.setProperty('--x', (Math.cos(ang) * dist).toFixed(0) + 'px');
    s.style.setProperty('--y', (Math.sin(ang) * dist - 50).toFixed(0) + 'px');
    s.style.setProperty('--r', (Math.random() * 720 - 360).toFixed(0) + 'deg');
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 1400);
  }
}

document.addEventListener('click', (e) => {
  burst(e.clientX || window.innerWidth / 2, e.clientY || window.innerHeight / 2, 8);
});

/* ================= 开始按钮（无音乐） ================= */
const btn = document.getElementById('startBtn');
const content = document.getElementById('loveContent');
const tip = document.getElementById('musicTip');

btn.addEventListener('click', () => {
  btn.style.display = 'none';
  tip.textContent = '浪漫正在发生……';
  content.classList.add('show');
  burst(window.innerWidth / 2, window.innerHeight / 2, 20);
});
</script>
</body>
</html>
