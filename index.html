<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>生日快乐 🎂</title>

<!-- 霞鹜文楷（手写楷体，浪漫感） -->
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.7.0/style.css">

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#06030c}

body{
  font-family:"LXGW WenKai Screen","LXGW WenKai","Kaiti SC",STKaiti,KaiTi,"PingFang SC","Microsoft YaHei",serif;
  -webkit-font-smoothing:antialiased;
  user-select:none;
  color:#fff;
}

/* ========== 舞台 & 背景 ========== */
.stage{position:fixed;inset:0;overflow:hidden}
.stage::before{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(ellipse 85% 60% at 50% 112%, rgba(255,80,160,.22), transparent 70%),
    radial-gradient(ellipse 75% 55% at 50% -12%, rgba(150,90,255,.24), transparent 70%),
    #06030c;
}

/* ========== 浪漫灯光（光晕球） ========== */
.glow{
  position:absolute;border-radius:50%;
  filter:blur(90px);opacity:.5;pointer-events:none;
  mix-blend-mode:screen;
}
.g1{width:46vw;height:46vw;left:-12vw;top:-10vw;
  background:radial-gradient(circle,#ff5fa2,transparent 70%);
  animation:drift1 22s ease-in-out infinite}
.g2{width:40vw;height:40vw;right:-10vw;top:6vh;
  background:radial-gradient(circle,#a86bff,transparent 70%);
  animation:drift2 27s ease-in-out infinite}
.g3{width:52vw;height:52vw;left:18vw;bottom:-28vw;opacity:.3;
  background:radial-gradient(circle,#ffb35c,transparent 70%);
  animation:drift3 31s ease-in-out infinite}
.g4{width:26vw;height:26vw;left:64vw;top:-8vw;opacity:.26;
  background:radial-gradient(circle,#5ce1ff,transparent 70%);
  animation:drift1 19s ease-in-out infinite reverse}

@keyframes drift1{
  0%,100%{transform:translate(0,0) scale(1)}
  50%{transform:translate(6vw,5vh) scale(1.15)}
}
@keyframes drift2{
  0%,100%{transform:translate(0,0) scale(1.05)}
  50%{transform:translate(-7vw,7vh) scale(.9)}
}
@keyframes drift3{
  0%,100%{transform:translate(0,0) scale(1)}
  50%{transform:translate(-5vw,-6vh) scale(1.2)}
}

/* ========== 粒子画布 ========== */
#fx{position:absolute;inset:0;z-index:2;pointer-events:none}

/* ========== 内容区 ========== */
.content{
  position:absolute;inset:0;z-index:10;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center;
  padding:clamp(1rem,4vh,3rem) clamp(1rem,5vw,4rem);
}

/* 小标题 */
.kicker{
  font-size:clamp(.72rem,2.2vmin,1.1rem);
  letter-spacing:.42em;
  text-indent:.42em;
  color:rgba(255,214,235,.78);
  text-shadow:0 0 14px rgba(255,120,190,.7);
  opacity:0;
  animation:fadeUp 1.2s ease forwards;
  animation-delay:.2s;
  margin-bottom:.6em;
}
.kicker .name{
  color:#ffe6a8;
  text-shadow:0 0 12px rgba(255,200,110,.9),0 0 30px rgba(255,160,80,.6);
}

/* 主标题：生日快乐 */
.title{
  display:flex;justify-content:center;align-items:baseline;
  font-size:clamp(3rem,18vmin,13rem);
  line-height:1.15;
  font-weight:700;
  margin:.1em 0 .32em;
  animation:titleGlow 3.6s ease-in-out infinite alternate;
}
.title span{
  display:inline-block;
  padding:0 .035em;
  color:#fff;
  text-shadow:
    0 0 6px #fff,
    0 0 18px rgba(255,175,215,.95),
    0 0 38px #ff5fa2,
    0 0 72px #ff2e88,
    0 0 130px #a855f7;
  opacity:0;
  animation:charPop .95s cubic-bezier(.34,1.56,.64,1) forwards;
}

@keyframes charPop{
  0%{opacity:0;transform:translateY(60px) scale(.6) rotate(-10deg)}
  55%{opacity:1}
  100%{opacity:1;transform:translateY(0) scale(1) rotate(0deg)}
}
@keyframes titleGlow{
  from{filter:drop-shadow(0 0 10px rgba(255,120,190,.35))}
  to{filter:drop-shadow(0 0 34px rgba(255,120,190,.8))}
}

/* 祝福标签 */
.chips{
  display:flex;flex-wrap:wrap;justify-content:center;
  gap:.55rem .9rem;
  margin-bottom:clamp(1.2rem,3.5vh,2.4rem);
}
.chip{
  padding:.42em 1.35em;
  border-radius:999px;
  font-size:clamp(.82rem,2.3vmin,1.3rem);
  letter-spacing:.16em;
  text-indent:.16em;
  color:#ffeaf6;
  border:1px solid rgba(255,180,220,.45);
  background:linear-gradient(135deg,rgba(255,140,200,.16),rgba(170,110,255,.16));
  box-shadow:
    0 0 20px rgba(255,120,190,.3),
    inset 0 0 16px rgba(255,180,220,.14);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  white-space:nowrap;
  opacity:0;
  animation:chipIn .85s cubic-bezier(.34,1.56,.64,1) forwards;
}
@keyframes chipIn{
  0%{opacity:0;transform:translateY(26px) scale(.78)}
  100%{opacity:1;transform:translateY(0) scale(1)}
}

/* 长文案 */
.msg{
  max-width:min(820px,80vw);
  font-size:clamp(.88rem,2.2vmin,1.32rem);
  line-height:2.25;
  letter-spacing:.16em;
  color:rgba(255,238,247,.84);
  text-shadow:0 0 20px rgba(255,140,200,.45);
  opacity:0;
  animation:fadeUp 1.6s ease forwards;
  animation-delay:3.1s;
}

/* 落款 */
.sign{
  margin-top:clamp(1rem,3vh,2rem);
  font-size:clamp(.75rem,1.9vmin,1.05rem);
  letter-spacing:.3em;
  text-indent:.3em;
  color:rgba(255,222,160,.9);
  text-shadow:0 0 16px rgba(255,190,90,.75),0 0 40px rgba(255,140,60,.45);
  opacity:0;
  animation:fadeUp 1.6s ease forwards;
  animation-delay:4.1s;
}

@keyframes fadeUp{
  0%{opacity:0;transform:translateY(22px)}
  100%{opacity:1;transform:translateY(0)}
}

/* 暗角，让灯光更聚焦 */
.vignette{
  position:absolute;inset:0;z-index:8;pointer-events:none;
  background:radial-gradient(ellipse 70% 65% at 50% 50%,transparent 40%,rgba(0,0,0,.55) 100%);
}

@media (max-width:520px){
  .kicker{letter-spacing:.3em;text-indent:.3em}
  .msg{line-height:2.1;letter-spacing:.1em}
}
</style>
</head>
<body>

<div class="stage">
  <!-- 浪漫灯光 -->
  <div class="glow g1"></div>
  <div class="glow g2"></div>
  <div class="glow g3"></div>
  <div class="glow g4"></div>

  <!-- 星光 / 爱心粒子 -->
  <canvas id="fx"></canvas>

  <!-- 文字内容 -->
  <div class="content">
    <p class="kicker">HAPPY BIRTHDAY · 致 <span class="name">亲爱的你</span></p>

    <h1 class="title">生日快乐</h1>

    <div class="chips">
      <span class="chip">健康常伴</span>
      <span class="chip">暴富暴富</span>
      <span class="chip">事事如意</span>
      <span class="chip">岁岁平安</span>
      <span class="chip">万事胜意</span>
    </div>

    <p class="msg">
      愿你从此以后，日日都是好天气。<br>
      愿你被爱包围，被好运追着跑，<br>
      想要的东西都得到，想见的人都在身边。<br>
      愿你眼里有光，心中有海，<br>
      往后余生，所有的美好都如期而至。
    </p>

    <p class="sign">—— 愿所有星光，都为你而亮 ✦</p>
  </div>

  <div class="vignette"></div>
</div>

<script>
/* ============================================================
   1. 主标题逐字入场
   ============================================================ */
(function splitTitle(){
  const title = document.querySelector('.title');
  const chars = Array.from(title.textContent.trim());
  title.textContent = '';
  chars.forEach((ch, i) => {
    const s = document.createElement('span');
    s.textContent = ch;
    s.style.animationDelay = (0.65 + i * 0.18).toFixed(2) + 's';
    title.appendChild(s);
  });
})();

/* ============================================================
   2. 祝福标签依次弹出
   ============================================================ */
document.querySelectorAll('.chip').forEach((c, i) => {
  c.style.animationDelay = (1.95 + i * 0.12).toFixed(2) + 's';
});

/* ============================================================
   3. Canvas 粒子：星光 + 漂浮爱心
   ============================================================ */
(function particleFX(){
  const cvs = document.getElementById('fx');
  const ctx = cvs.getContext('2d');
  let W = 0, H = 0, DPR = 1;

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    cvs.width  = W * DPR;
    cvs.height = H * DPR;
    cvs.style.width  = W + 'px';
    cvs.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize();
  window.addEventListener('resize', () => { resize(); initMotes(); });

  /* ---------- 星光粒子 ---------- */
  const HUES = [330, 305, 45, 195, 275];
  const MOTE_COUNT = window.innerWidth < 700 ? 26 : 46;
  let motes = [];

  function makeMote(born){
    return {
      x: Math.random() * W,
      y: born ? Math.random() * H : H + 20,
      r: Math.random() * 2.1 + 0.6,
      vy: -(Math.random() * 0.35 + 0.10),
      vx: (Math.random() - 0.5) * 0.22,
      a: Math.random() * 0.55 + 0.25,
      hue: HUES[(Math.random() * HUES.length) | 0],
      ph: Math.random() * Math.PI * 2,
      sp: Math.random() * 0.02 + 0.006
    };
  }
  function initMotes(){
    motes = [];
    for (let i = 0; i < MOTE_COUNT; i++) motes.push(makeMote(true));
  }
  initMotes();

  /* ---------- 爱心 ---------- */
  const HEART_COUNT = window.innerWidth < 700 ? 5 : 9;
  let hearts = [];

  function makeHeart(born){
    return {
      x: Math.random() * W,
      y: born ? Math.random() * H : H + 60,
      s: Math.random() * 14 + 9,
      vy: -(Math.random() * 0.34 + 0.22),
      vx: (Math.random() - 0.5) * 0.32,
      hue: Math.random() > 0.45 ? 335 : 45,
      maxA: Math.random() * 0.28 + 0.16,
      ph: Math.random() * Math.PI * 2,
      alpha: 0
    };
  }
  for (let i = 0; i < HEART_COUNT; i++) hearts.push(makeHeart(true));

  function heartPath(x, y, w){
    const h = w;
    ctx.beginPath();
    ctx.moveTo(x, y + h * 0.30);
    ctx.bezierCurveTo(x, y - h * 0.10, x - w * 0.55, y - h * 0.10, x - w * 0.55, y + h * 0.30);
    ctx.bezierCurveTo(x - w * 0.55, y + h * 0.62, x, y + h * 0.80, x, y + h);
    ctx.bezierCurveTo(x, y + h * 0.80, x + w * 0.55, y + h * 0.62, x + w * 0.55, y + h * 0.30);
    ctx.bezierCurveTo(x + w * 0.55, y - h * 0.10, x, y - h * 0.10, x, y + h * 0.30);
    ctx.closePath();
  }

  /* ---------- 主循环 ---------- */
  let t = 0;
  function loop(){
    t++;
    ctx.clearRect(0, 0, W, H);

    // 星光
    for (let i = 0; i < motes.length; i++){
      const m = motes[i];
      m.y += m.vy;
      m.x += Math.sin(t * m.sp + m.ph) * 0.45 + m.vx;
      if (m.y < -30 || m.x < -40 || m.x > W + 40){
        motes[i] = makeMote(false);
        continue;
      }
      ctx.beginPath();
      ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
      ctx.fillStyle = 'hsla(' + m.hue + ',100%,78%,' + m.a + ')';
      ctx.shadowBlur = 14;
      ctx.shadowColor = 'hsla(' + m.hue + ',100%,65%,.9)';
      ctx.fill();
    }

    // 爱心
    for (let i = 0; i < hearts.length; i++){
      const h = hearts[i];
      h.y += h.vy;
      h.x += h.vx + Math.sin(t * 0.012 + h.ph) * 0.35;

      const p = Math.min(Math.max((H + 60 - h.y) / (H + 120), 0), 1);
      h.alpha = Math.sin(p * Math.PI) * h.maxA;

      if (h.y < -80){
        hearts[i] = makeHeart(false);
        continue;
      }

      ctx.save();
      ctx.globalAlpha = h.alpha;
      ctx.shadowBlur = 22;
      ctx.shadowColor = 'hsla(' + h.hue + ',100%,68%,.95)';
      ctx.fillStyle = 'hsla(' + h.hue + ',100%,80%,.95)';
      heartPath(h.x, h.y, h.s);
      ctx.fill();
      ctx.restore();
    }

    requestAnimationFrame(loop);
  }
  loop();
})();
</script>
</body>
</html>
