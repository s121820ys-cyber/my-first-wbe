<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>提示</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
        body{
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            background:#f5f5f5;
        }
        .box{
            background:#fff;
            padding:40px 30px;
            border-radius:16px;
            text-align:center;
            box-shadow:0 2px 12px #00000015;
        }
        .text{
            font-size:24px;
            color:#222;
            margin-bottom:24px;
        }
        button{
            padding:10px 22px;
            border:none;
            background:#444;
            color:#fff;
            border-radius:8px;
            font-size:16px;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="text">SB别扫了</div>
        <button onclick="window.close()">关闭并返回</button>
    </div>
</body>
</html>
